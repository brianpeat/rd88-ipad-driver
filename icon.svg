<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7a9c"/>
      <stop offset="1" stop-color="#15384f"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aeb6c1"/>
      <stop offset="0.35" stop-color="#f4f6f9"/>
      <stop offset="1" stop-color="#9aa3af"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b94a0"/>
      <stop offset="0.35" stop-color="#d5dae1"/>
      <stop offset="1" stop-color="#7a838f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15181d"/>
      <stop offset="0.3" stop-color="#2c313a"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="200"/>
    </clipPath>

    <!-- 1/4" TS plug: centred on x = 0, tip at y = 0, housing ends at y = 393 -->
    <g id="ts">
      <rect x="-15" y="481" width="30" height="700" fill="#111317"/>
      <path d="M-30 391 L30 391 L17 491 L-17 491 Z" fill="#1b1e24"/>
      <rect x="-48" y="273" width="96" height="120" rx="14" fill="url(#body)"/>
      <g fill="#0b0d10" opacity="0.7">
        <rect x="-48" y="307" width="96" height="8"/>
        <rect x="-48" y="331" width="96" height="8"/>
        <rect x="-48" y="355" width="96" height="8"/>
      </g>
      <rect x="-38" y="241" width="76" height="34" rx="6" fill="url(#collar)"/>
      <rect x="-20" y="101" width="40" height="142" fill="url(#metal)"/>
      <rect x="-20" y="87" width="40" height="14" fill="#111317"/>
      <path d="M-20 87 L-20 62 L-13 54 L-13 44 Q-27 32 -22 20 Q-14 0 0 0 Q14 0 22 20 Q27 32 13 44 L13 54 L20 62 L20 87 Z" fill="url(#metal)"/>
    </g>

    <!-- 5-pin MIDI (DIN) plug: centred on x = 0, sleeve top at y = 0, housing ends at y = 244 -->
    <g id="midi">
      <rect x="-18" y="332" width="36" height="850" fill="#111317"/>
      <path d="M-40 242 L40 242 L20 342 L-20 342 Z" fill="#1b1e24"/>
      <rect x="-65" y="103" width="130" height="141" rx="18" fill="url(#body)"/>
      <g fill="#0b0d10" opacity="0.7">
        <rect x="-65" y="146" width="130" height="9"/>
        <rect x="-65" y="172" width="130" height="9"/>
        <rect x="-65" y="198" width="130" height="9"/>
      </g>
      <rect x="-65" y="75" width="130" height="30" rx="6" fill="url(#collar)"/>
      <rect x="-58" y="0" width="116" height="77" rx="8" fill="url(#metal)"/>
    </g>
  </defs>

  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <use href="#midi" transform="translate(280 378) scale(1.4)"/>
    <use href="#ts" transform="translate(520 170) scale(1.4)"/>
    <use href="#ts" transform="translate(760 170) scale(1.4)"/>
  </g>
</svg>
